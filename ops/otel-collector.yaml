# Lesson 7.2: the OpenTelemetry Collector receives, batches and forwards.
# Beacon → OTLP/HTTP :4318 → traces to Tempo, metrics exposed for Prometheus.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Cost control (lesson 7.2 🔴): keep every error and every slow trace, sample the rest.
  # tail_sampling needs one collector per trace; enable it when volume makes traces expensive.

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # service.name → the `job` label; never tenant ids (cardinality).
    resource_to_telemetry_conversion:
      enabled: false

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
