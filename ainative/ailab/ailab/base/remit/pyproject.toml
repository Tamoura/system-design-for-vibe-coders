[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "najm-remit"
version = "0.4.0"
description = "Najm Remit: send money home from Qatar (fictional demo service of the fictional Najm Bank)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # standard library only: do not add a dependency without a ticket

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
