# Proposes updates for the GitHub Actions used in .github/workflows/. Every action is pinned to a full
# commit SHA (a supply-chain control the System Design course teaches in lessons 5.6 and 8.4); Dependabot
# opens a pull request with the new SHA and version comment, and a person reviews it before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
