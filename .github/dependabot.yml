# Lesson 8.1 (🟡): "most of your code is other people's code". Weekly update PRs for npm packages,
# the Docker base image and the GitHub Actions CI uses; CI (tests, npm audit, trivy) reviews each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
