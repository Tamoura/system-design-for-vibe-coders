name: Publish course

# Builds every distributable form of the course and publishes it to GitHub Pages.
# The committed HTML is verified against the markdown first, so a stale page
# fails the run instead of quietly shipping.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel an in-flight Pages deployment — interrupting it is what
  # produced 'cancelled' deploys. Let a running deploy finish; queue the next.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the committed HTML matches the markdown
        run: npm run check

      - name: Verify the SaaS course output matches its markdown
        run: npm run saas:check

      - name: Verify the AIGP course output matches its markdown
        run: npm run aigp:check

      - name: Verify the AI PM course output matches its markdown
        run: npm run aipm:check

      - name: Verify every course self-assessment matches its items
        run: npm run assess:check

      - name: Verify the security course output matches its markdown
        run: if [ -f secai/index.html ]; then npm run secai:check; else echo "secai course not built yet — skipped"; fi

      - name: Verify the career course output matches its markdown
        run: if [ -f career/index.html ]; then npm run career:check; else echo "career course not built yet — skipped"; fi

      - name: Verify the data course output matches its markdown
        run: if [ -f data/index.html ]; then npm run data:check; else echo "data course not built yet — skipped"; fi

      - name: Verify the cloud course output matches its markdown
        run: if [ -f cloud/index.html ]; then npm run cloud:check; else echo "cloud course not built yet — skipped"; fi

      - name: Verify the agentic pages carry the site navigation
        run: node scripts/agentic-nav.mjs --check

      - name: Check the SaaS course's GitHub repo links (report only)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run saas:repos

      - name: Build PDF and EPUB editions
        run: npm run dist

      - name: Assemble the site
        run: |
          # Course library: landing hub at root, each course in its own subpath.
          mkdir -p _site _site/vibe _site/agentic _site/saas _site/aigp _site/aipm _site/secai _site/career _site/data _site/cloud
          cp landing.html _site/index.html
          # The vibe course (bilingual pages + downloads) → /vibe/
          cp index.html index.en.html index.ar.html assessment.html assessment.ar.html _site/vibe/
          cp dist/course-en.pdf dist/course-ar.pdf _site/vibe/
          cp dist/course-en.epub dist/course-ar.epub _site/vibe/
          # The agentic course (curriculum, playbook, poster, assessment) → /agentic/
          cp -r agentic/. _site/agentic/
          # SaaS Building Blocks (single generated page) → /saas/
          cp saas/index.html saas/course.html saas/COURSE.md saas/REPOS.md \
             saas/index.ar.html saas/course.ar.html saas/COURSE.ar.md saas/REPOS.ar.md \
             saas/assessment.html saas/assessment.ar.html _site/saas/
          # AI Governance: Zero to Hero (AIGP-aligned) → /aigp/
          cp aigp/index.html aigp/course.html aigp/COURSE.md aigp/INSTRUMENTS.md \
             aigp/index.ar.html aigp/course.ar.html aigp/COURSE.ar.md aigp/INSTRUMENTS.ar.md \
             aigp/assessment.html aigp/assessment.ar.html _site/aigp/
          # AI Product Management: Zero to Hero → /aipm/
          cp aipm/index.html aipm/course.html aipm/COURSE.md aipm/TOOLKIT.md \
             aipm/index.ar.html aipm/course.ar.html aipm/COURSE.ar.md aipm/TOOLKIT.ar.md \
             aipm/assessment.html aipm/assessment.ar.html _site/aipm/
          # Secure AI & Application Security: Zero to Hero → /secai/ (once built)
          if [ -f secai/index.html ]; then
            cp secai/index.html secai/course.html secai/COURSE.md secai/TOOLKIT.md \
               secai/index.ar.html secai/course.ar.html secai/COURSE.ar.md secai/TOOLKIT.ar.md \
               secai/assessment.html secai/assessment.ar.html _site/secai/
          fi
          # From Graduate to Hired → /career/ (once built)
          if [ -f career/index.html ]; then
            cp career/index.html career/course.html career/COURSE.md career/TOOLKIT.md \
               career/index.ar.html career/course.ar.html career/COURSE.ar.md career/TOOLKIT.ar.md \
               career/assessment.html career/assessment.ar.html _site/career/
          fi
          # Data Engineering & Analytics: Zero to Hero → /data/ (once built)
          if [ -f data/index.html ]; then
            cp data/index.html data/course.html data/COURSE.md data/TOOLKIT.md \
               data/index.ar.html data/course.ar.html data/COURSE.ar.md data/TOOLKIT.ar.md \
               data/assessment.html data/assessment.ar.html _site/data/
          fi
          # Cloud & DevOps: Zero to Hero → /cloud/ (once built)
          if [ -f cloud/index.html ]; then
            cp cloud/index.html cloud/course.html cloud/COURSE.md cloud/TOOLKIT.md \
               cloud/index.ar.html cloud/course.ar.html cloud/COURSE.ar.md cloud/TOOLKIT.ar.md \
               cloud/assessment.html cloud/assessment.ar.html _site/cloud/
          fi
          ls -lh _site _site/vibe _site/agentic _site/saas _site/aigp _site/aipm _site/secai _site/career _site/data _site/cloud

      # Every link on the assembled site, internal and external. Report only: a dead third-party
      # page should be fixed in the lesson, not block the deploy. Results are in the run summary.
      # Excluded official sites work in a browser but fail automated checks: qcb.gov.qa and
      # almeezan.qa serve an incomplete certificate chain, Gulf labour-ministry and job-board sites
      # (mol.gov.qa, mohre.gov.ae, nafis.gov.ae, naukrigulf.com) refuse or time out automated checks, canada.ca breaks lychee's HTTP/2, and
      # fda.gov answers 404 to bots.
      - name: Check every link on the site (report only)
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0, pinned by commit
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 20 --max-retries 2
            --accept '200..=299,403,429'
            --exclude-loopback --exclude '^https?://(www\.)?example\.(com|org)'
            --exclude '^https://www\.(qcb\.gov\.qa|almeezan\.qa|canada\.ca|fda\.gov|mol\.gov\.qa|mohre\.gov\.ae|nafis\.gov\.ae|naukrigulf\.com)/'
            '_site/**/*.html'
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Only the default branch publishes; pull requests stop after the build.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 min: wait out a slow Pages backend, don't abort at 10
          error_count: 25     # tolerate more transient status-poll errors before failing
