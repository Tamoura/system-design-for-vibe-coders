name: Publish course

# Builds every distributable form of the course and publishes it to GitHub Pages.
# The committed HTML is verified against the markdown first, so a stale page
# fails the run instead of quietly shipping.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel an in-flight Pages deployment — interrupting it is what
  # produced 'cancelled' deploys. Let a running deploy finish; queue the next.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0, pinned by commit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0, pinned by commit
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the committed HTML matches the markdown
        run: npm run check

      - name: Verify the SaaS course output matches its markdown
        run: npm run saas:check

      - name: Verify the AIGP course output matches its markdown
        run: npm run aigp:check

      - name: Verify the AI PM course output matches its markdown
        run: npm run aipm:check

      - name: Verify every course self-assessment matches its items
        run: npm run assess:check

      - name: Verify the security course output matches its markdown
        run: if [ -f secai/index.html ]; then npm run secai:check; else echo "secai course not built yet — skipped"; fi

      - name: Verify the career course output matches its markdown
        run: if [ -f career/index.html ]; then npm run career:check; else echo "career course not built yet — skipped"; fi

      - name: Verify the data course output matches its markdown
        run: if [ -f data/index.html ]; then npm run data:check; else echo "data course not built yet — skipped"; fi

      - name: Verify the cloud course output matches its markdown
        run: if [ -f cloud/index.html ]; then npm run cloud:check; else echo "cloud course not built yet — skipped"; fi

      - name: Verify the testing course output matches its markdown
        run: if [ -f testing/index.html ]; then npm run testing:check; else echo "testing course not built yet — skipped"; fi

      - name: Verify the AI applications and agents course output matches its markdown
        run: if [ -f aiapps/index.html ]; then npm run aiapps:check; else echo "aiapps course not built yet — skipped"; fi

      - name: Verify the AI-native engineer course output matches its markdown
        run: if [ -f ainative/index.html ]; then npm run ainative:check; else echo "ainative course not built yet — skipped"; fi

      - name: Verify the founder course output matches its markdown
        run: if [ -f founder/index.html ]; then npm run founder:check; else echo "founder course not built yet — skipped"; fi

      - name: Verify the IT-as-a-business course output matches its markdown
        run: if [ -f itbiz/index.html ]; then npm run itbiz:check; else echo "itbiz course not built yet — skipped"; fi

      - name: Verify the agentic pages carry no organisation name
        run: node scripts/agentic-neutral.mjs --check

      - name: Verify the agentic pages carry the site navigation
        run: node scripts/agentic-nav.mjs --check

      # Content checks (scripts/qa/README.md). Each one blocks the build.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0, pinned by commit
        with:
          python-version: '3.11'

      - name: Check every Arabic lesson against its English source
        run: python scripts/qa/check_ar_all.py

      - name: Check that answer options give no new length or gloss cues
        run: python scripts/qa/quiz_cues.py

      - name: Check the standing Arabic rules (diagram direction, DPO, English glosses)
        run: python scripts/qa/arabic_rules.py

      - name: Check for banned names, exam-pass promises and landing links to agentic/
        run: python scripts/qa/claims_lint.py

      - name: Check the landing and about counts match academy/catalogue.json
        run: python scripts/qa/site_counts.py

      - name: Check every lesson states an outcome and a study time
        run: python scripts/qa/lesson_outcomes.py

      - name: Test that the self-assessment group views do not run injected content
        run: npm run test:assess

      - name: Check the SaaS course's GitHub repo links (report only)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run saas:repos

      - name: Build PDF and EPUB editions
        run: npm run dist

      - name: Assemble the site
        run: |
          # Course library: landing hub at root, each course in its own subpath.
          mkdir -p _site _site/vibe _site/agentic _site/saas _site/aigp _site/aipm _site/secai _site/career _site/data _site/cloud _site/testing _site/aiapps _site/ainative _site/founder _site/itbiz
          cp landing.html _site/index.html
          # How these courses are made (linked from every page's notice) → /about/
          mkdir -p _site/about
          cp about/index.html about/index.ar.html _site/about/
          # Course trailers (scripts/build-videos.mjs): played on the landing page and each course home
          mkdir -p _site/videos/renders _site/vibe/videos/renders
          cp videos/renders/*.mp4 videos/renders/*.jpg _site/videos/renders/
          cp videos/renders/vibe.mp4 videos/renders/vibe.jpg _site/vibe/videos/renders/
          # The vibe course (bilingual pages + downloads) → /vibe/
          cp index.html index.en.html index.ar.html assessment.html assessment.ar.html _site/vibe/
          cp dist/course-en.pdf dist/course-ar.pdf _site/vibe/
          cp dist/course-en.epub dist/course-ar.epub _site/vibe/
          # The agentic course (curriculum, playbook, poster, assessment) → /agentic/
          cp -r agentic/. _site/agentic/
          # SaaS Building Blocks (single generated page) → /saas/
          cp saas/index.html saas/course.html saas/COURSE.md saas/REPOS.md \
             saas/index.ar.html saas/course.ar.html saas/COURSE.ar.md saas/REPOS.ar.md \
             saas/assessment.html saas/assessment.ar.html _site/saas/
          # AI Governance: Zero to Hero (AIGP-aligned) → /aigp/
          cp aigp/index.html aigp/course.html aigp/COURSE.md aigp/INSTRUMENTS.md \
             aigp/index.ar.html aigp/course.ar.html aigp/COURSE.ar.md aigp/INSTRUMENTS.ar.md \
             aigp/assessment.html aigp/assessment.ar.html _site/aigp/
          # AI Product Management: Zero to Hero → /aipm/
          cp aipm/index.html aipm/course.html aipm/COURSE.md aipm/TOOLKIT.md \
             aipm/index.ar.html aipm/course.ar.html aipm/COURSE.ar.md aipm/TOOLKIT.ar.md \
             aipm/assessment.html aipm/assessment.ar.html _site/aipm/
          # Secure AI & Application Security: Zero to Hero → /secai/ (once built)
          if [ -f secai/index.html ]; then
            cp secai/index.html secai/course.html secai/COURSE.md secai/TOOLKIT.md \
               secai/index.ar.html secai/course.ar.html secai/COURSE.ar.md secai/TOOLKIT.ar.md \
               secai/assessment.html secai/assessment.ar.html _site/secai/
            # The starter lab the lessons link to (secai/lab/README.md and its files)
            mkdir -p _site/secai/lab && cp -r secai/lab/. _site/secai/lab/ && rm -rf _site/secai/lab/__pycache__ _site/secai/lab/logs
          fi
          # From Graduate to Hired → /career/ (once built)
          if [ -f career/index.html ]; then
            cp career/index.html career/course.html career/COURSE.md career/TOOLKIT.md \
               career/index.ar.html career/course.ar.html career/COURSE.ar.md career/TOOLKIT.ar.md \
               career/assessment.html career/assessment.ar.html _site/career/
          fi
          # Data Engineering & Analytics: Zero to Hero → /data/ (once built)
          if [ -f data/index.html ]; then
            cp data/index.html data/course.html data/COURSE.md data/TOOLKIT.md \
               data/index.ar.html data/course.ar.html data/COURSE.ar.md data/TOOLKIT.ar.md \
               data/assessment.html data/assessment.ar.html _site/data/
          fi
          # Cloud & DevOps: Zero to Hero → /cloud/ (once built)
          if [ -f cloud/index.html ]; then
            cp cloud/index.html cloud/course.html cloud/COURSE.md cloud/TOOLKIT.md \
               cloud/index.ar.html cloud/course.ar.html cloud/COURSE.ar.md cloud/TOOLKIT.ar.md \
               cloud/assessment.html cloud/assessment.ar.html _site/cloud/
          fi
          # Software Testing: Zero to Hero in the AI Era → /testing/ (once built)
          if [ -f testing/index.html ]; then
            cp testing/index.html testing/course.html testing/COURSE.md testing/TOOLKIT.md \
               testing/index.ar.html testing/course.ar.html testing/COURSE.ar.md testing/TOOLKIT.ar.md \
               testing/assessment.html testing/assessment.ar.html _site/testing/
          fi
          # Building AI Applications & Agents: Zero to Hero → /aiapps/ (once built)
          if [ -f aiapps/index.html ]; then
            cp aiapps/index.html aiapps/course.html aiapps/COURSE.md aiapps/TOOLKIT.md \
               aiapps/index.ar.html aiapps/course.ar.html aiapps/COURSE.ar.md aiapps/TOOLKIT.ar.md \
               aiapps/assessment.html aiapps/assessment.ar.html _site/aiapps/
          fi
          # A Practical Guide to Becoming an AI-Native Engineer → /ainative/ (once built)
          if [ -f ainative/index.html ]; then
            cp ainative/index.html ainative/course.html ainative/COURSE.md ainative/TOOLKIT.md \
               ainative/index.ar.html ainative/course.ar.html ainative/COURSE.ar.md ainative/TOOLKIT.ar.md \
               ainative/assessment.html ainative/assessment.ar.html _site/ainative/
          fi
          # Founder's Playbook for AI-First Builders → /founder/ (once built)
          if [ -f founder/index.html ]; then
            cp founder/index.html founder/course.html founder/COURSE.md founder/TOOLKIT.md \
               founder/index.ar.html founder/course.ar.html founder/COURSE.ar.md founder/TOOLKIT.ar.md \
               founder/assessment.html founder/assessment.ar.html _site/founder/
          fi
          # Running IT as a Business → /itbiz/ (once built)
          if [ -f itbiz/index.html ]; then
            cp itbiz/index.html itbiz/course.html itbiz/COURSE.md itbiz/TOOLKIT.md \
               itbiz/index.ar.html itbiz/course.ar.html itbiz/COURSE.ar.md itbiz/TOOLKIT.ar.md \
               itbiz/assessment.html itbiz/assessment.ar.html _site/itbiz/
          fi
          ls -lh _site _site/about _site/vibe _site/agentic _site/saas _site/aigp _site/aipm _site/secai _site/career _site/data _site/cloud _site/testing _site/aiapps _site/ainative _site/founder _site/itbiz

      # Internal links on the assembled site must resolve (files and #anchors). This blocks the deploy:
      # a broken link inside the library is ours to fix. External links are reported by the next step.
      - name: Check every internal link on the assembled site
        run: python scripts/qa/site_links.py _site

      # Every external link on the assembled site. Report only: a dead third-party
      # page should be fixed in the lesson, not block the deploy. Results are in the run summary.
      # Only http(s) links are checked here; internal links are checked by the step above.
      # Excluded official sites work in a browser but fail automated checks: qcb.gov.qa and
      # almeezan.qa serve an incomplete certificate chain, Gulf labour-ministry and job-board sites
      # (mol.gov.qa, mohre.gov.ae, nafis.gov.ae, naukrigulf.com) refuse or time out automated checks, canada.ca breaks lychee's HTTP/2, and
      # fda.gov answers 404 to bots.
      # So do www.ftc.gov, consumer.ftc.gov/articles/job-scams, github.com/useautumn/autumn and
      # github.com/unkeyed/unkey from the CI runner, although all four pages are live (checked by web
      # search on 2026-11-12), so they are excluded rather than edited out of the lessons.
      - name: Check every external link on the site (report only)
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0, pinned by commit
        with:
          args: >-
            --no-progress --scheme https --scheme http --max-concurrency 8 --timeout 20 --max-retries 2
            --accept '200..=299,403,429'
            --exclude-loopback --exclude '^https?://(www\.)?example\.(com|org)'
            --exclude '^https://www\.(qcb\.gov\.qa|almeezan\.qa|canada\.ca|fda\.gov|mol\.gov\.qa|mohre\.gov\.ae|nafis\.gov\.ae|naukrigulf\.com)/'
            --exclude '^https://(www\.ftc\.gov/?$|consumer\.ftc\.gov/articles/job-scams$|github\.com/(useautumn/autumn|unkeyed/unkey)$)'
            '_site/**/*.html'
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v3.0.1, pinned by commit
        with:
          path: _site

  deploy:
    # Only the default branch publishes; pull requests stop after the build.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4.0.5, pinned by commit
        with:
          timeout: 1800000   # 30 min: wait out a slow Pages backend, don't abort at 10
          error_count: 25     # tolerate more transient status-poll errors before failing
