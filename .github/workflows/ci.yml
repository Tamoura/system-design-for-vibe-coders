name: CI

on:
  push:
  pull_request:

jobs:
  # Lesson 8.1 (🟢): no secret ever lands. gitleaks scans the WHOLE history (fetch-depth: 0), so a
  # key committed in any branch fails CI even if a later commit deleted it: rotate it, then allowlist
  # the old commit in .gitleaks.toml only after it is revoked. The pre-commit hook does the same locally.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner

  # Lesson 8.1 (🟡): supply chain. Known-vulnerable dependencies. A HIGH or CRITICAL advisory in a
  # production dependency fails the build; the full report (dev tools included) is informational.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies, blocking at high)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (everything, report only)
        run: npm audit || true
      - name: trivy (lockfile and config, report only)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: '0'

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beacon" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon
      # A throwaway value so the build can load Better Auth. Real secrets live in
      # the deploy environment, never in the repo (lesson 8.1).
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Lesson 8.2 (🟡): the AI summary eval (fixture incidents, injection attempts included). With no
      # ANTHROPIC_API_KEY it runs on the fake provider: the pipeline, validation and guards, not the model.
      - run: npm run ai:eval
      # Lesson 7.4: docs/configuration.md is generated from the config schema; it must match the code.
      - run: npm run env:docs:check
      # Lesson 5.2 (🟡): the committed OpenAPI document must match the code.
      - run: npm run openapi:check
      # With DATABASE_URL set, tests/queue.integration.test.ts also runs the
      # job queue against this real Postgres (lesson 5.1).
      - run: npm test
      - name: Migrations apply to a real Postgres
        run: npm run db:migrate
      - run: npm run build

  # Lesson 7.4: build ONE image per commit, tagged with the git SHA. The deploy
  # workflow (deploy.yml) promotes this exact image; nothing is rebuilt for production.
  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            GIT_SHA=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # Lesson 7.2: with this secret, the build uploads the browser source maps to Sentry
          # for this release, then deletes them from the image (scripts/sentry-sourcemaps.sh).
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ghcr.io/${{ github.repository }}/beacon:${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs as a non-root user and has no dev dependencies or .env files
        run: |
          docker buildx build --load --build-arg GIT_SHA=${{ github.sha }} -t beacon:ci .
          test "$(docker run --rm --entrypoint id beacon:ci -u)" = "1000"
          docker run --rm --entrypoint sh beacon:ci -c '! ls node_modules/vitest node_modules/typescript node_modules/tsx 2>/dev/null && ! ls -a | grep -q "^.env"'
      # Lesson 8.1 (🟡): "CI fails on critical CVEs in the worker image". The web app, the worker
      # and the migrations are one image (lesson 7.4), so this scans all three. Fixed-in-a-newer-
      # version CRITICALs fail; accepted risks go in .trivyignore with a reason and an expiry.
      - name: trivy (the image, blocking on CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: beacon:ci
          trivy-config: trivy.yaml
          severity: CRITICAL
          exit-code: '1'
