name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beacon" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrations apply to a real Postgres
        run: npm run db:migrate
      - run: npm run build
