# Local infrastructure for Beacon. `docker compose up -d` and you have:
#   Postgres  → localhost:5432 (user/password/db: beacon)
#   Mailpit   → SMTP on localhost:1025, inbox UI on http://localhost:8025 (used from lesson 4.1)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon"]
      interval: 2s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
